  pdi_yacimientos:
    sources: [['data/clean/clean_yacimientos.csv~csv']]
    s: res:pdi/$(id_uri)
    po:
      - [a, gamere:XacementoArqueoloxco]
      - [gamere:nome,        $(Name), xsd:string]
      - [gamere:fuenteDatos, "yacimientos-csv", xsd:string]
      - p: gamere:situadaEn
        o:
          - value: res:concello/$(id_concello)
            type: iri
      - p: gamere:estaEn
