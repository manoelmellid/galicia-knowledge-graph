            type: iri

  # ── PLAYAS GENÉRICAS sin duplicados ─────────────────────────────
  pdi_playas_genericas:
    sources: [['data/clean/clean_playas_genericas_sin_dup.csv~csv']]
    s: res:pdi/$(id_uri)
    po:
      - [a, gamere:Praia]
      - [gamere:nome,        $(Name), xsd:string]
      - [gamere:nomePraia,   $(Name), xsd:string]
      - [gamere:banderaAzul, "false", xsd:boolean]
      - [gamere:fuenteDatos, "playas-genericas-csv", xsd:string]
      - p: gamere:situadaEn
        o:
          - value: res:concello/$(id_concello)
            type: iri
      - p: gamere:estaEn
        o:
          - value: res:ubicacion/$(lat)_$(lon)
