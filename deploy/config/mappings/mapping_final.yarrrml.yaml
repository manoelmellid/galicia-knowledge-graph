  ubicaciones_playas_gen:
    sources: [['data/clean/clean_playas_genericas_sin_dup.csv~csv']]
    s: res:ubicacion/$(lat)_$(lon)
    po:
      - [a, gamere:Ubicacion]
      - [gamere:coordenadasX, $(lat), xsd:float]
      - [gamere:coordenadasY, $(lon), xsd:float]
